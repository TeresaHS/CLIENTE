<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJERCICIO 10</title>
</head>
<body>
    <script>

        /* Se realizó un censo provincial y se desea procesar la información obtenida en
        dicho censo. De cada una de las personas censadas se tiene la siguiente
        información: número de documento, edad y sexo ('femenino' o 'masculino').
        Se pide confeccionar un programa que lea los datos de cada persona censada (para
        finalizar ingresar el valor cero en el número de documento) e informar:

        a) Cantidad total de personas censadas.
        b) Cantidad de varones.
        c) Cantidad de mujeres.
        d) Cantidad de varones cuya edad varía entre 16 y 65 años. */

        let personas = [];

        let numeroDocumento = parseInt(prompt("Ingrese el número de documento (0 para finalizar):"));

        while (numeroDocumento !== 0) {
            
            let edad, sexo;

            do {
                
                edad = parseInt(prompt("Ingrese la edad:"));

            } while (isNaN(edad) || edad <= 0);

            do{

                sexo = prompt("Ingrese el sexo (femenino/masculino):").toLowerCase();

            }while(sexo !== "femenino" && sexo !== "masculino");

            personas.push({ documento: numeroDocumento, edad: edad, sexo: sexo });

            numeroDocumento = parseInt(prompt("Ingrese el número de documento (0 para finalizar):"));
        }
        console.log(personas.length);
        console.log(personas.filter(p => p.sexo === "masculino").length);
        console.log(personas.filter(p => p.sexo === "femenino").length);
        console.log(personas.filter(p => p.sexo === "masculino" && p.edad >= 16 && p.edad <= 65).length);

    </script>
</body>
</html>
