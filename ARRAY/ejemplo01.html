<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        /* SLICE */

        let nums = [1, 2, 3, 4, 5];

        let parte = nums.slice(1, 3);  // comienza en el indice 1 hasta limite indice 3 sin contar con él

        console.log(nums);
        console.log(parte);

        /* SPLICE */

        let arr = [1, 2, 3, 4];

        arr.splice(1, 2); // comienza en el indice 1 del array, especifica cuantos quiere borrar desde esa posicion (2)
        console.log(arr);

        arr.splice(1, 0, 99); // indica que se coloca en el indice 1, borra 0, sustituye por valor 99 y "emouja" porque ya estaba ocupado
        console.log(arr);

        /* CONCAT */

        let a = [1, 2];
        let b = [3, 4];
        let c = a.concat(b); // [1, 2, 3, 4]

        /* FOR EACH*/

        let frutas = ["manzana", "platano", "pera"];

        frutas.forEach((f,i) => console.log(i, f)); // f= valor   i=clave

        /* MAP */

        let dobles = [1,2,3].map(x => x * 2); // [2,4,6]
        console.log(dobles);

        /* FILTER */
        
        let pares = [1,2,3,4].filter(x => x % 2 === 0); // [2,4]
        console.log(pares);

        /* REDUCE */

        let suma = [1,2,3,4].reduce((acc, val) => acc + val, 0); // el valor indicado al final es el valor inicial de el reduce
        console.log(suma);

        /* SORT */
        
        let letras = ["b", "a", "c"];
        letras.sort(); // ["a", "b", "c"]

        console.log(letras);

        console.log([10, 2, 30].sort((a, b) => a - b));
        console.log([10, 2, 30].sort((a, b) => b - a));

        /* REVERSE */

        console.log([1, 2, 3].reverse()); // [3, 2, 1]
        console.log([5, 2, 8, 9].reverse()); // [3, 2, 1]

        /* ARRAYS Y DESESTRUCTURACIÓN */

        console.log("Misma cantidad de variables y valores");
        let [a1, b1] = [10, 20];
        console.log(a1); // 10
        console.log(b1); // 20

        console.log("Más variables que valores");
        let [a2, b2, c2] = [10];
        console.log(a2); // 10
        console.log(b2); // undefined
        console.log(c2); // undefined

        console.log("Menos variables que valores");
        let [a3] = [10, 30, 50];
        console.log(a3); // 10


        /* SPREAD OPERADOR */

        let nums2 = [1,2,3];
        let copia = [...nums2];
        let combinado = [...nums2, 4, 5];

        console.log(Array.from(123)); // no puede, tiene que ser string
        console.log(Array.from("123"));

        let numeros = [1, 2, 3, 4, 5];
        let resultado = numeros
        .filter(n => n % 2 === 0)
        .map(n => n * 10)
        .reduce((a,b) => a + b, 0);
        console.log(resultado); // 60

        console.log(resultado); // 60

        */

    </script>
</body>
</html>
