        /**

         */

        console.log("EJERCICIO 1 -------------------------------------------------------------------------------");

        function nombresJugadoresMediocampistas(){
            console.log(jugadores.filter(futbolista => futbolista.posicion === "Mediocampista").map(futbolista => futbolista.nombre));
        }

        nombresJugadoresMediocampistas();

        /**
         * Ejercicio 2.
         * Crea una función que muestre por consola los nombres de lo jugadores que hayan jugado 30 o mas partidos.
         * @return NO
         */

        console.log("EJERCICIO 2 -------------------------------------------------------------------------------");

        function nombresJugadores30PartidosOMas(){
            console.log(jugadores.filter(futbolista => futbolista.partidosJugados >= 30).map(futbolista => futbolista.nombre));
        }

        nombresJugadores30PartidosOMas();

        /**
         * Ejercicio 3.

         * @return NO
         */

        console.log("EJERCICIO 3 -------------------------------------------------------------------------------");

        function nombresJugadoresInternacionales(){
            console.log(jugadores.filter(futbolista => futbolista.esInternacional).map(futbolista => futbolista.nombre));
        }

        nombresJugadoresInternacionales();

        /**
         * Ejercicio 4.
         * Crea una funcion que retorne los nombres de los jugadores que juegan en la 'Premier League'
         * @description
         * @param
         * @return Array nombres
         */

        console.log("EJERCICIO 4 -------------------------------------------------------------------------------");

        function nombresJugadoresPremierLeague(){
            return jugadores.filter(futbolista => futbolista.liga === "Premier League").map(futbolista => futbolista.nombre);
        }

        console.log(nombresJugadoresPremierLeague());
        
        /**
         * Ejercicio 5.
         * Crea una funcion que devuelva todos los delanteros que juegan en la 'Ligue 1'
         * @return Array nombres
         */

        console.log("EJERCICIO 5 -------------------------------------------------------------------------------");

        function nombresJugadoresDelanterosLigue1(){
            return jugadores.filter(futbolista => futbolista.posicion === "Delantero" && futbolista.liga === "Ligue 1").map(futbolista => futbolista.nombre);
        }

        console.log(nombresJugadoresDelanterosLigue1());

        /**

         * @return NO
         */

        console.log("EJERCICIO 6 -------------------------------------------------------------------------------");

        function nombresJugadoresEstadisticas(){
            jugadores.forEach(futbolista => console.log(`${futbolista.nombre}: ${futbolista.estadisticas.asistencias} asistencias, ${futbolista.estadisticas.faltasSufridas} faltas sufridas, ${futbolista.estadisticas.minutosJugados}  minutos jugados`));
        }

        nombresJugadoresEstadisticas();
