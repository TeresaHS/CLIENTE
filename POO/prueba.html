    class Personaje {
        name;
        energy;

        constructor(name, energy = 10) {
            this.name = name;
            this.energy = energy;
        }

        get status() {
            return '⭐'.repeat(this.energy);
        }

        set status(stars) {
            this.energy = stars.length;
        }
    }

    const mario = new Personaje("Mario");
    mario.energy    // 10
    mario.status = '⭐⭐⭐'
    mario.energy    // 3
    mario.status    // '⭐⭐⭐'
