<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRAR</title>

    <style>
        *{
            box-sizing: border-box;
        }

        form{
            width: 300px;
        }
        form label, form input{
            display: inline;
            width: 100%;
        }

        form input{
            margin: 0 0 20px 0;
        }

        :is(input):invalid {
        background: red;
        }

        :is(input):valid {
        
            background-color: white;
        }
    </style>
</head>
<body>

    <!--
    Nombre y apellidos: 1 mayuscula, 3 o mas letras, sin numeros
    contraseña: alfanumerica mas de 16 caracteres
    correo electronico: con .guadalupe@alumnado.fundacionloyola.net .guadalupe@alumnado.fundacionloyola.com
    -->

    <form>
        <label for="nombre">Nombre y apellidos:</label>
        <input pattern="[A-Z][a-Z]{2,}([A-Z][a-Z]{2,})*" type="text" id="nombre" name="nombre"/>

        <label for="usuario">Usuario:</label>
        <input pattern=".+\.guadalupe@alumnado\.fundacionloyola\.(net|com)" type="text" id="usuario" name="usuario"/>

        <label for="password">Contraseña:</label>
        <input minlength="17" type="text" id="password" name="password"/>

        <button id="registrar">Registrar</button>

    </form>

    <script>

        //para que no me salte
        const form = document.querySelector("form");

        form.addEventListener("submit", (e) => {
            e.preventDefault();
            if (form.checkValidity()) {
                alert("Usuario registrado");
            } else {
                form.reportValidity();
            }
        });

        const registrar = document.getElementById("registrar");

        registrar.addEventListener("onclick", () => {
            alert("Usuario registrado");
        });
    </script>

</body>
</html>
