<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Simulación de entrada de usuario
        let intentos = 0;
        let adivinado = false;
        let numeroSecreto = 7;
        let respuesta;
        while (!adivinado && intentos < 3) {
        // Simulamos respuesta del usuario
        respuesta = intentos === 1 ? 7 : 5;

        if (respuesta === numeroSecreto) {
        console.log("¡Correcto!");
        adivinado = true;
        } else {
        console.log("Intenta de nuevo");
        intentos++;
        }
        }
    </script>
</body>
</html>
