<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
</head>
<body>
    <h2>2. Dado el objeto: let coche = {marca: "Toyota", modelo: "Corolla", anio: 2020}</h2>
    <h2>Muestra por consola la marca del coche.</h2>
    <h2>Cambia el año a 2024.</h2>
    <h2>Agrega una propiedad color con valor "rojo".</h2>

    <script>
        let coche = {marca: "Toyota", modelo: "Corolla", anio: 2020};

        console.log(coche);

        console.log("Marca: "+coche.marca);

        coche.anio = 2024;
        
        console.log("Anio: "+coche.anio);

        coche.color = "rojo";

        console.log(coche);

    </script>
</body>
</html>
